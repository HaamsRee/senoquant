name: senoquant
contributions:
  commands:
    - id: senoquant.make_widget
      python_name: senoquant._widget:SenoQuantWidget
      title: SenoQuant
    - id: senoquant.reader
      python_name: senoquant._reader:get_reader
      title: SenoQuant reader
  widgets:
    - command: senoquant.make_widget
      display_name: SenoQuant
